name: Test and build
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: PYTHONPATH=src python -m unittest discover -s tests -v
      - run: python bin/pstack-portable build --output dist/first
      - run: python bin/pstack-portable build --output dist/second
      - run: diff -r dist/first dist/second
      - run: python bin/pstack-portable package --bundle dist/first
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-bundle
          path: |
            dist/pstack-portable.tar.gz
            dist/pstack-portable.tar.gz.sha256
