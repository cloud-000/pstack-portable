[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pstack-portable"
version = "0.1.0"
description = "Pinned, reproducible pstack adaptations for Codex and Antigravity"
requires-python = ">=3.11.8"
dependencies = []

[project.scripts]
pstack-portable = "pstack_portable.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
